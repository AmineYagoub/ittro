# Versions and releases with release-please (starters/release-please/README.md).
# Copy to .github/workflows/release.yml.
#
# On every push to main, release-please reads the commits since the last release (the squashed
# pull request titles, in Conventional Commits form) and keeps one pull request open, "chore(main):
# release X.Y.Z", that sets the next version and writes CHANGELOG.md. Merging that pull request tags
# vX.Y.Z and publishes the GitHub release.
#
# release-please opens that pull request with GITHUB_TOKEN, as github-actions[bot], and GitHub holds
# the CI and title runs on a bot's pull request until a maintainer approves them in its merge box.
# Starting them here with workflow_dispatch wouldn't help: GitHub doesn't count those runs' checks
# for the pull request, so the ruleset would still block it.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request and release
    runs-on: ubuntu-latest
    permissions:
      contents: write        # tags, releases, the release branch
      issues: write          # labels on the release pull request
      pull-requests: write   # the release pull request
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # To publish a package when a release is made (npm, PyPI, crates.io, pub.dev, Packagist),
      # add its steps here with: if: steps.release.outputs.release_created == 'true'
      # A tag made with GITHUB_TOKEN starts no workflows, so a separate "on: release" workflow
      # wouldn't run.

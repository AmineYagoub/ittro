# CI for a static site, a dataset or a static API: test and build on every pull request and every
# push to main, then deploy the build to Cloudflare Workers, as djazair.dev and wilayas do.
# Copy to .github/workflows/ci.yml, set the build commands and DIST, and add a wrangler.jsonc that
# serves DIST as static assets (https://developers.cloudflare.com/workers/static-assets/).
#
# Deploys are off until three settings exist, so the workflow is safe to merge first:
# the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and the repository variable
# DEPLOY_ENABLED set to "true". Setting the variable to anything else pauses deploys.
# The first deploy must come from main: a pull request can upload a preview only once the Worker exists.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DIST: dist                       # the folder the build writes

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # A Node build (Astro, Eleventy, Vite…). For a Python build, use actions/setup-python@v7
      # and run its commands instead, e.g. python build.py and python -m unittest.
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test --if-present
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: ${{ env.DIST }}
          include-hidden-files: true   # keeps _headers and _redirects
          retention-days: 7

  deploy-settings:
    name: Check deploy settings
    needs: build
    # main deploys to production; pull requests from this repository upload a preview; pull
    # requests from forks only test and build, since they can't read the secrets.
    if: >-
      github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENABLED: ${{ vars.DEPLOY_ENABLED }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ] && [ "$ENABLED" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped: DEPLOY_ENABLED is not true, or the Cloudflare secrets are missing."
          fi

  deploy:
    name: Deploy to Cloudflare
    needs: deploy-settings
    if: needs.deploy-settings.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ github.event_name != 'pull_request' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v7       # for wrangler.jsonc
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: ${{ env.DIST }}
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            ${{ github.event_name != 'pull_request' && 'deploy' || format('versions upload --preview-alias=pr-{0}', github.event.pull_request.number) }}
            --message=${{ github.sha }}
      - name: Summary
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: echo "Deployed to $URL" >> "$GITHUB_STEP_SUMMARY"

# CI for a PHP project with Composer: validate composer.json, install, and run the tests on every
# pull request and every push to main. Copy to .github/workflows/ci.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']        # the versions the project supports
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Test
        run: |
          if composer run-script --list 2>/dev/null | grep -qE '^ +test '; then composer test; else vendor/bin/phpunit; fi

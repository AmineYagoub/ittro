# Releases (docs/contributing/releases.md). On every push to main, release-please keeps one pull
# request open with the next app and relay versions and their changelogs. Merging it tags
# app-vX.Y.Z and relay-vX.Y.Z and publishes their GitHub releases. A new app release is then built
# from its tag as CI builds it, with the relay's access code, checked against the live relay first,
# signed with the release key, and attached to its release with its checksum. A new relay release
# is deployed to Cloudflare and checked. Both jobs run in the "release" environment, which holds
# the secrets and waits for a maintainer's approval; nothing that runs on a pull request reaches it.
# A tag made with GITHUB_TOKEN starts no workflows, so the jobs live here, not "on: release".
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RELAY: https://ittro.djazair.dev

jobs:
  release-please:
    name: Release pull request and releases
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      app: ${{ steps.release.outputs.release_created }}
      app-tag: ${{ steps.release.outputs.tag_name }}
      app-version: ${{ steps.release.outputs.version }}
      relay: ${{ steps.release.outputs['relay--release_created'] }}
      relay-tag: ${{ steps.release.outputs['relay--tag_name'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  apk:
    name: Android release
    needs: release-please
    if: needs.release-please.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.app-tag }}
      APK: ittro-${{ needs.release-please.outputs.app-version }}.apk
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.app-tag }}
          persist-credentials: false

      - name: Check that the live relay takes the access code
        env:
          CODE: ${{ secrets.ITTRO_ACCESS_CODE }}
        run: |
          if [[ -z "$CODE" ]]; then
            echo "::error title=Access code::The release environment has no ITTRO_ACCESS_CODE"
            exit 1
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            -H "authorization: Bearer $CODE" "$RELAY/helper-pair?code=release-check")
          if [[ "$status" != 200 ]]; then
            echo "::error title=Access code::$RELAY answered $status to the release's access code"
            exit 1
          fi

      - name: Build the APK and check its permissions
        id: build
        uses: ./.github/actions/apk
        with:
          access-code: ${{ secrets.ITTRO_ACCESS_CODE }}

      - name: Sign it with the release key
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          KSPASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          BUILT: ${{ steps.build.outputs.apk }}
        run: |
          if [[ -z "$KEYSTORE" || -z "$KSPASS" ]]; then
            echo "::error title=Signing::The release environment has no RELEASE_KEYSTORE or RELEASE_KEYSTORE_PASSWORD"
            exit 1
          fi
          umask 077
          keystore="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$keystore"' EXIT
          base64 --decode <<< "$KEYSTORE" > "$keystore"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign --ks "$keystore" --ks-key-alias ittro \
            --ks-pass env:KSPASS --key-pass env:KSPASS --alignment-preserved \
            --v1-signing-enabled false --v4-signing-enabled false --out "$APK" "$BUILT"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK" |
            grep 'certificate SHA-256 digest' | tee -a "$GITHUB_STEP_SUMMARY"
          sha256sum "$APK" > SHA256SUMS.txt

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$APK" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY"

  relay:
    name: Relay deploy
    needs: release-please
    if: needs.release-please.outputs.relay == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.relay-tag }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install the locked dependencies
        working-directory: relay
        run: npm ci --no-audit

      - name: Deploy
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes wrangler@4.156.1 deploy 2>&1 | grep -v -i 'workers\.dev'

      - name: Check the live relay
        env:
          CODE: ${{ secrets.ITTRO_ACCESS_CODE }}
        run: |
          curl -fsS --max-time 20 "$RELAY/health"
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            -H "authorization: Bearer $CODE" "$RELAY/helper-pair?code=release-check")
          if [[ "$status" != 200 ]]; then
            echo "::error title=Relay::$RELAY answered $status to the release's access code after the deploy"
            exit 1
          fi

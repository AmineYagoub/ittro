# Dependabot opens a pull request each week when a dependency has a new version.
# Keep the ecosystems this project uses and delete the others (docs: https://docs.github.com/code-security/dependabot).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

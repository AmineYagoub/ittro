<title>Ittro permissions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..700&amp;display=swap">

<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0E13; color: #F5F3EE; font-family: 'Readex Pro', system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; left: 24px; top: 44px; width: 60px; height: 60px; border-radius: 50%; background: #2A62F0;  display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="#FFFFFF"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path><path d="M19.5 5.5a9 9 0 0 1 0 13"></path></svg></div>
  <div style="position: absolute; left: 24px; right: 24px; top: 140px; display: flex; flex-direction: column; gap: 16px">
    <p style="margin: 0; font-size: 30px; font-weight: 600; line-height: 1.3; color: #F5F3EE">I need the microphone to hear you and the camera to see the shelf. Android will ask twice. Double-tap Allow each time.</p>
  </div>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 330px; background: rgba(0, 0, 0, 0.45)"></div>
  <div style="position: absolute; left: 20px; right: 20px; bottom: 32px; box-sizing: border-box; padding: 26px 22px 18px; border-radius: 28px; background: #E9ECF2; color: #1B1F27; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; justify-content: center"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#2A62F0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg></div>
    <p style="margin: 0; font-size: 20px; text-align: center; line-height: 1.35">Allow <b>Ittro</b> to record audio?</p>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="height: 52px; border-radius: 26px; background: #2A62F0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 500">While using the app</span>
      <span style="height: 52px; border-radius: 26px; background: #DCE1EA; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 500">Only this time</span>
      <span style="height: 52px; border-radius: 26px; background: #DCE1EA; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 500">Don’t allow</span>
    </div>
    <p style="margin: 0; font-size: 13px; color: #5A6270; text-align: center">Android’s own dialog. TalkBack reads it, not Ittro.</p>
  </div>
</div>

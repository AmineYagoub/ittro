<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ittro helper page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..700&amp;display=swap">
<style>
body{margin:0}
a{color:#7EA6FF}a:hover{color:#B8CCFF}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 28px 24px; background: #F5F3EE; color: #0B0E13; font-family: 'Readex Pro', system-ui, sans-serif; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; gap: 10px"><div style="width: 36px; height: 36px; border-radius: 10px; overflow: hidden"><svg viewBox="0 0 108 108" width="36" height="36" role="img" aria-label="Ittro logo"><rect width="108" height="108" fill="#2A62F0"></rect><rect x="44" y="24" width="38" height="54" rx="11" fill="none" stroke="#FFFFFF" stroke-width="6"></rect><path d="M58.04 45.04 A11 11 0 0 1 69.63 53.15" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"></path><path d="M57.43 38.07 A18 18 0 0 1 76.39 51.34" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"></path><path d="M28 92 L51.2 65.1" stroke="#2A62F0" stroke-width="24" stroke-linecap="round"></path><path d="M28 92 L59 56" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"></path></svg></div><span style="font-size: 16px; color: #4A515C">Ittro helper · for Sara</span></div>
  <p style="margin: 0; font-size: 26px; font-weight: 600; line-height: 1.3">Is this Masaad water, 1.5 litres?</p>
  <div style="border-radius: 18px; overflow: hidden"><svg viewBox="0 0 342 300" width="342" height="300" aria-hidden="true"><rect width="342" height="300" fill="#1A2029"></rect><rect x="120" y="20" width="30" height="22" rx="4" fill="#3E7CD8"></rect><path d="M120 42 H150 V58 C150 78 186 84 186 110 V280 H84 V110 C84 84 120 78 120 58 Z" fill="#2C3642" stroke="#4A5664" stroke-width="2"></path><rect x="84" y="150" width="102" height="70" fill="#F1D57A"></rect><text x="135" y="193" text-anchor="middle" font-size="20" font-weight="600" fill="#3A2F07" font-family="Readex Pro, sans-serif">مسعد</text><path d="M10 300 L120 200" stroke="#C49A7A" stroke-width="46" stroke-linecap="round"></path></svg></div>
  <p style="margin: 0; font-size: 15px; color: #4A515C">Ittro's read: Masaad, size unreadable.</p>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <button type="button" style="height: 60px; border: 0; border-radius: 16px; background: #2BD98A; color: #0B0E13; font-family: inherit; font-size: 20px; font-weight: 600">Yes</button>
    <button type="button" style="height: 60px; border: 0; border-radius: 16px; background: #B3261E; color: #FFFFFF; font-family: inherit; font-size: 20px; font-weight: 600">No</button>
    <button type="button" style="height: 60px; border: 0; border-radius: 16px; background: #FFB224; color: #0B0E13; font-family: inherit; font-size: 17px; font-weight: 600">Can't tell</button>
  </div>
  <label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: #4A515C">A short note, read aloud to them
    <span style="height: 48px; border-radius: 12px; border: 2px solid #C9CDD4; background: #FFFFFF; display: flex; align-items: center; padding: 0 14px; font-size: 17px; color: #0B0E13">it's the big one</span></label>
  <p style="margin: 0; font-size: 13px; color: #4A515C">The photo is deleted when you answer, or after 30 minutes.</p>
</div>
</body>
</html>

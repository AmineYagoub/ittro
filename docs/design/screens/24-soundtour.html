<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0E13; color: #F5F3EE; font-family: 'Readex Pro', system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; left: 24px; top: 44px; width: 60px; height: 60px; border-radius: 50%; background: #2A62F0;  display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="#FFFFFF"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path><path d="M19.5 5.5a9 9 0 0 1 0 13"></path></svg></div>
  <div style="position: absolute; left: 24px; right: 24px; top: 130px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-radius: 16px; background: #161B23; "><span aria-hidden="true" style="width: 40px; display: flex; justify-content: center"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#B8CCFF" stroke-width="2.2" stroke-linecap="round"><path d="M9 18V6l10-2v12"></path><circle cx="6.5" cy="18" r="2.5"></circle><circle cx="16.5" cy="16" r="2.5"></circle></svg></span><span style="font-size: 20px; font-weight: 500; line-height: 1.3">One short note: I heard you.</span></div>
    <div style="display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-radius: 16px; background: #161B23; "><span aria-hidden="true" style="width: 40px; display: flex; justify-content: center"><svg viewBox="0 0 24 24" width="28" height="28"><circle cx="5" cy="12" r="2.4" fill="#7EA6FF"></circle><circle cx="12" cy="12" r="2.4" fill="#7EA6FF" opacity="0.65"></circle><circle cx="19" cy="12" r="2.4" fill="#7EA6FF" opacity="0.35"></circle></svg></span><span style="font-size: 20px; font-weight: 500; line-height: 1.3">Soft ticks: I’m working.</span></div>
    <div style="display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-radius: 16px; background: #1E2A44; box-shadow: 0 0 0 2px #7EA6FF;"><span aria-hidden="true" style="width: 40px; display: flex; justify-content: center"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#B8CCFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l8 8 8-4"></path><path d="M16 10h4v4"></path></svg></span><span style="font-size: 20px; font-weight: 500; line-height: 1.3">A falling note: I lost track.</span></div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 28px 24px 40px; border-radius: 28px 28px 0 0; background: #161B23; display: flex; flex-direction: column; gap: 20px">
    <p style="margin: 0; font-size: 32px; font-weight: 600; line-height: 1.3; color: #F5F3EE">This falling note means I lost track of your hand. Keep it still.</p>
  </div>
</div>
